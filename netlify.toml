[build]
  publish = "."

# Serve the upload page for any request on the upload subdomain
[[redirects]]
  from = "https://upload.thetrustvoice.com/"
  to = "/upload.html"
  status = 200
  force = true

[[redirects]]
  from = "https://upload.thetrustvoice.com/*"
  to = "/upload.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
