[build]
  publish = "."

# Canonical host: permanently redirect the auto-generated Netlify subdomain
# to the custom domain, preserving the path (and query string). Keeps
# thetrustvoice.com the single origin visitors and search engines see.
# Matches only the exact production host — deploy-preview-*/branch-- URLs
# (different hostnames) are unaffected, so PR previews still work.
[[redirects]]
  from = "https://the-trust-voice.netlify.app/*"
  to = "https://thetrustvoice.com/:splat"
  status = 301
  force = true

# Serve the upload page for any request on the upload subdomain
[[redirects]]
  from = "https://upload.thetrustvoice.com/"
  to = "/upload.html"
  status = 200
  force = true

[[redirects]]
  from = "https://upload.thetrustvoice.com/*"
  to = "/upload.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://www.clarity.ms https://*.clarity.ms; frame-ancestors 'none'"
