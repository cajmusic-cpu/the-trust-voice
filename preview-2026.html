<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Trust Voice &mdash; Preview</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --navy-deep: #0F1E2E;
    --navy:      #1B2E45;
    --navy-line: #2C3D63;
    --gold:      #B08D3E;
    --gold-soft: #C9A968;
    --cream:     #F7F4EE;
    --serif: Georgia, 'Times New Roman', serif;
    --sans:  Calibri, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ── Header ── */
  header {
    padding: 28px 24px;
    display: flex;
    justify-content: center;
    border-bottom: 1px solid var(--navy-line);
  }
  .wordmark {
    font-family: var(--serif);
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cream);
    text-decoration: none;
  }
  .wordmark span { color: var(--gold); }

  /* ── Main ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 80px;
  }

  /* ── Headline ── */
  .headline {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.2;
    text-align: center;
    color: var(--cream);
    max-width: 20ch;
    margin-bottom: 48px;
  }
  .headline em {
    font-style: italic;
    color: var(--gold-soft);
  }

  /* ── Video ── */
  .video-wrap {
    width: 100%;
    max-width: 860px;
    background: #000;
    border: 1px solid var(--navy-line);
    position: relative;
  }
  .video-wrap video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 540px;
    object-fit: contain;
  }

  /* ── Video loader overlay ── */
  .video-loader {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #000;
    pointer-events: none;
    z-index: 1;
  }
  .video-loader.active { display: flex; }
  .loader-ring {
    width: 36px;
    height: 36px;
    border: 2px solid rgba(176, 141, 62, 0.18);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(247, 244, 238, 0.4);
  }

  /* ── Tagline ── */
  .tagline {
    margin-top: 44px;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(16px, 2vw, 20px);
    color: var(--gold-soft);
    letter-spacing: 0.04em;
    text-align: center;
  }

  /* ── CTA button ── */
  .cta {
    display: inline-block;
    margin-top: 36px;
    padding: 12px 28px;
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-soft);
    text-decoration: none;
    border: 1px solid var(--gold);
    transition: background 0.2s, color 0.2s;
  }
  .cta:hover, .cta:focus-visible {
    background: var(--gold);
    color: var(--navy-deep);
  }

  /* ── Email capture ── */
  .email-capture {
    margin-top: 48px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  .email-divider {
    width: 40px;
    height: 1px;
    background: var(--navy-line);
    margin: 0 auto 28px;
  }
  .email-capture-label {
    font-size: 13px;
    color: var(--cream);
    letter-spacing: 0.03em;
    margin-bottom: 16px;
  }
  .email-row {
    display: flex;
    gap: 8px;
  }
  .email-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--navy-line);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .email-input::placeholder { color: rgba(247,244,238,0.3); }
  .email-input:focus { border-color: var(--gold); }
  .email-btn {
    background: transparent;
    border: 1px solid var(--navy-line);
    color: rgba(247,244,238,0.55);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .email-btn:hover, .email-btn:focus-visible {
    border-color: var(--gold);
    color: var(--gold-soft);
  }
  .email-feedback {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .email-feedback.success { color: var(--gold-soft); }
  .email-feedback.error   { color: rgba(247,244,238,0.45); }
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  /* ── Footer ── */
  footer {
    padding: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--navy-line);
    border-top: 1px solid var(--navy-line);
  }

  @media (max-width: 600px) {
    main { padding: 44px 16px 60px; }
    .headline { margin-bottom: 36px; }
    .tagline { margin-top: 32px; }
    .cta { margin-top: 28px; }
    .email-capture { margin-top: 36px; }
    .email-row { flex-direction: column; }
    .email-btn { width: 100%; }
  }
</style>

</head>
<body>

<header>
  <a href="/" class="wordmark">THE <span>TRUST</span> VOICE</a>
</header>

<main>
  <h1 class="headline">Your voice.<br><em>Preserved forever.</em></h1>

  <div class="video-wrap">
    <div class="video-loader" id="videoLoader" aria-hidden="true">
      <div class="loader-ring"></div>
      <span class="loader-text">Loading&hellip;</span>
    </div>
    <video
      id="previewVideo"
      controls
      playsinline
      preload="metadata"
      poster=""
      aria-label="The Trust Voice — private preview">
      <source src="media/ttv-private-f8c2a17d.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </div>

  <p class="tagline">Preserving wisdom. Not just wealth.</p>

  <a href="https://thetrustvoice.com/legacy#contact" class="cta">
    Request a private conversation
  </a>

  <div class="email-capture">
    <div class="email-divider"></div>
    <p class="email-capture-label">Not ready to talk yet? Get the full walkthrough by email.</p>
    <form
      id="previewEmailForm"
      name="preview-email-signup"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      novalidate>
      <input type="hidden" name="form-name" value="preview-email-signup">
      <p class="visually-hidden">
        <label>Leave this blank: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
      </p>
      <input type="hidden" name="utm_source"   id="pe_utm_source">
      <input type="hidden" name="utm_medium"   id="pe_utm_medium">
      <input type="hidden" name="utm_campaign" id="pe_utm_campaign">
      <input type="hidden" name="utm_content"  id="pe_utm_content">
      <input type="hidden" name="utm_term"     id="pe_utm_term">
      <div class="email-row">
        <input
          type="email"
          name="email"
          id="peEmail"
          class="email-input"
          placeholder="Your email address"
          required
          autocomplete="email">
        <button type="submit" class="email-btn">Send it</button>
      </div>
      <p class="email-feedback" id="peEmailFeedback" aria-live="polite"></p>
    </form>
  </div>
</main>

<footer>
  &copy; <script>document.write(new Date().getFullYear())</script> The Trust Voice LLC. Private &amp; confidential.
</footer>

<script>
(function () {
  var v = document.getElementById('previewVideo');
  var loader = document.getElementById('videoLoader');
  if (!v || !loader) return;
  function show() { loader.classList.add('active'); }
  function hide() { loader.classList.remove('active'); }
  v.addEventListener('waiting',    show);
  v.addEventListener('playing',    hide);
  v.addEventListener('canplay',    hide);
  v.addEventListener('loadeddata', hide);
  v.addEventListener('error',      hide);
}());

// ── Preview email capture ──────────────────────────────────────────────────
(function () {
  var UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
  var utms = {};
  try { var s = sessionStorage.getItem('ttv_preview_utms'); if (s) utms = JSON.parse(s); } catch(e) {}
  var qs = new URLSearchParams(window.location.search);
  UTM_KEYS.forEach(function(k) { if (qs.get(k)) utms[k] = qs.get(k); });
  try { sessionStorage.setItem('ttv_preview_utms', JSON.stringify(utms)); } catch(e) {}
  UTM_KEYS.forEach(function(k) {
    var el = document.getElementById('pe_' + k);
    if (el && utms[k]) el.value = utms[k];
  });
  var form = document.getElementById('previewEmailForm');
  var feedback = document.getElementById('peEmailFeedback');
  if (!form || !feedback) return;
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('peEmail');
    if (!email || !email.value.trim()) return;
    feedback.textContent = '';
    feedback.className = 'email-feedback';
    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(new FormData(form)).toString()
    })
    .then(function(res) {
      if (!res.ok) throw new Error();
      form.innerHTML = '<p class="email-feedback success">You\'re on the list. We\'ll be in touch.</p>';
    })
    .catch(function() {
      feedback.textContent = 'Something went wrong — please try again or email info@thetrustvoice.com.';
      feedback.className = 'email-feedback error';
    });
  });
}());
</script>
</body>
</html>
